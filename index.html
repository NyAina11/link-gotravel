<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Liens | Go Travel</title>
  <meta name="description" content="Accédez rapidement à nos liens officiels et services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decorations">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <main class="container">
    <div class="card">
      <!-- En-tête / Profil -->
      <header class="header">
        <div class="logo-wrapper">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
          </svg>
        </div>
        <h1 class="title">Go Travel</h1>
        <p class="subtitle">Sélectionnez une option pour continuer</p>
      </header>

      <!-- Liste des boutons de redirection -->
      <nav class="links-group" aria-label="Liens rapides">
        <!-- Bouton 1 : modifiez href="..." et le texte -->
        <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="link-btn" id="btn-1">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Premier Lien</span>
            <span class="btn-desc">Description ou destination du lien 1</span>
          </div>
          <span class="btn-arrow" aria-hidden="true">&rarr;</span>
        </a>

        <!-- Bouton 2 : modifiez href="..." et le texte -->
        <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="link-btn" id="btn-2">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Deuxième Lien</span>
            <span class="btn-desc">Description ou destination du lien 2</span>
          </div>
          <span class="btn-arrow" aria-hidden="true">&rarr;</span>
        </a>

        <!-- Bouton 3 : modifiez href="..." et le texte -->
        <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="link-btn" id="btn-3">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Troisième Lien</span>
            <span class="btn-desc">Description ou destination du lien 3</span>
          </div>
          <span class="btn-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </nav>

      <!-- Pied de page -->
      <footer class="footer">
        <p>&copy; 2026 Go Travel &bull; Tous droits réservés</p>
      </footer>
    </div>
  </main>
</body>
</html>
